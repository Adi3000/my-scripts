services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.137.0
    restart: unless-stopped
    env_file: "/etc/default/doco-cd"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/docker/doco-cd/data:/data
      - type: bind
        source: /etc/default
        target: /etc/default
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/domoticz/.config/domoticz.conf
        target: /home/domoticz/.config/domoticz.conf
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    healthcheck: # runs the image's built-in /healthcheck command
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik

networks:
  traefik:
    driver: bridge
    name: traefik
    external: true
